apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
      protocol: TCP

